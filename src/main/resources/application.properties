spring.application.name=TimeForge
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=${DB_URL:jdbc:h2:file:./.data/timeforge;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.error.include-message=never
timeforge.gemini-key=${GEMINI_API_KEY:}
timeforge.gemini-model=${GEMINI_MODEL:gemini-2.5-flash}
timeforge.admin-user=${ADMIN_USER:}
timeforge.admin-password=${ADMIN_PASSWORD:}

spring.web.resources.static-locations=classpath:/vista/
